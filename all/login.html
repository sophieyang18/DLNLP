<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录 - 拾艺 - SHEE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        /* 头部保持不变 */
        .main-content {
            margin-top: 70px;
            background: #FFB6C1;
            height: calc(100vh - 70px);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 50px 60px;
            border-radius: 30px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            width: 500px;
            transform: translateY(-10%);
        }

        .form-title {
            text-align: center;
            color: #FF69B4;
            font-size: 28px;
            margin-bottom: 30px;
            font-weight: bold;
        }

        /* 新增反馈提示样式 */
        #loginFeedback {
            margin-top: 20px;
            text-align: center;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            transition: all 0.3s;
            display: none;
        }

        .success {
            color: #28a745;
            background-color: #d4edda;
        }

        .error {
            color: #dc3545;
            background-color: #f8d7da;
        }

        /* 表单样式保持不变 */
        .form-group {
            position: relative;
            margin-bottom: 25px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 15px 2px 15px 15px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }

        input:focus {
            border-color: #FF69B4;
            outline: none;
        }

        .input-icon {
            position: absolute;
            left: -25px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 18px;
        }

        .button-group {
            display: flex;
            gap: 20px;
            margin-top: 35px;
        }

        button {
            flex: 1;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .cancel-btn {
            background: #f8f8f8;
            color: #666;
            border: 2px solid #eee;
        }

        .cancel-btn:hover {
            background: #eee;
        }

        .login-btn {
            background: #FF69B4;
            color: white;
            border: 2px solid #FF69B4;
        }

        .login-btn:hover {
            background: #ff5aa3;
        }

        .options {
            margin-top: 25px;
            text-align: center;
        }

        .options a {
            color: #FF69B4;
            text-decoration: none;
            font-size: 14px;
            margin: 0 10px;
            transition: opacity 0.3s;
        }

        .options a:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <!-- 导航栏保持不变 -->
    
    <div class="main-content">
        <div class="login-box">
            <h2 class="form-title">用户登录</h2>
            <div id="loginFeedback"></div>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" placeholder="请输入用户名" maxlength="20" required>
                </div>
                <div class="form-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" placeholder="请输入密码" maxlength="20" required>
                </div>
                <div class="button-group">
                    <button type="button" class="cancel-btn" onclick="history.back()">取消</button>
                    <button type="submit" class="login-btn">立即登录</button>
                </div>
                <div class="options">
                    <a href="register.html">立即注册</a>
                    <a href="#">忘记密码？</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 登录处理函数
        async function handleLogin(e) {
            e.preventDefault();
            const form = e.target;
            const formData = new FormData(form);
            const feedback = document.getElementById('loginFeedback');
            
            try {
                // 这里应替换为真实的API调用
                const response = await simulateLoginRequest(formData);
                
                if(response.success) {
                    localStorage.setItem('isLoggedIn', 'true');
                    showFeedback('登录成功！', 'success');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                } else {
                    showFeedback('用户名或密码错误', 'error');
                }
            } catch (error) {
                showFeedback('登录请求失败，请重试', 'error');
            }
        }

        // 模拟登录请求（实际应替换为真实API）
        function simulateLoginRequest(formData) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    // 模拟验证逻辑
                    const username = formData.get('username');
                    const password = formData.get('password');
                    
                    // 简单验证示例
                    if(username === 'test' && password === '123456') {
                        resolve({ success: true });
                    } else {
                        resolve({ success: false });
                    }
                }, 500);
            });
        }

        // 显示反馈提示
        function showFeedback(message, type) {
            const feedback = document.getElementById('loginFeedback');
            feedback.textContent = message;
            feedback.className = `#${type}`;
            feedback.style.display = 'block';
            
            // 自动隐藏逻辑
            setTimeout(() => {
                feedback.style.display = 'none';
            }, type === 'success' ? 2000 : 5000);
        }


    </script>
</body>
</html>
